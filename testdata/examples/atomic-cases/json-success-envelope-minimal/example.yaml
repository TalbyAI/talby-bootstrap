schema_version: 1
id: json-success-envelope-minimal
kind: atomic-case
polarity: positive
summary: Return the minimal JSON success envelope for a successful install.
commands:
  - argv:
      - tbboot
      - --output
      - json
      - install
      - file:local-example-source
      - --artifact
      - base-readme
verification:
  exit_code: exact
  stdout_text: absent
  stdout_json: exact
  consumer_state: absent
normative_outputs:
  - expected/exit-code.txt
  - expected/stdout.json
tags:
  - json
  - output
  - success
