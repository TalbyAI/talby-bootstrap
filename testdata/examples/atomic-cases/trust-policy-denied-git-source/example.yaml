schema_version: 1
id: trust-policy-denied-git-source
kind: atomic-case
polarity: negative
summary: Reject a git source that is not approved by the manifest trust policy.
commands:
  - argv:
      - tbboot
      - install
      - git:github.com/example/library
verification:
  exit_code: exact
  stdout_text: contains
  stdout_json: absent
  consumer_state: exact
normative_outputs:
  - expected/exit-code.txt
  - expected/stdout-contains.yaml
  - expected/consumer
tags:
  - trust-policy
  - git-source
  - negative
