schema_version: 1
id: declare-only-flow
kind: scenario
status: active
polarity: positive
summary: Declare a file source install without lockfile or materialization changes.
commands:
  - argv:
      - tbboot
      - install
      - file:local-example-source
      - --declare-only
verification:
  exit_code: exact
  stdout_text: exact
  stdout_json: absent
  stderr_text: absent
  stderr_json: absent
  consumer_state: exact
normative_outputs:
  - expected/exit-code.txt
  - expected/stdout.txt
  - expected/consumer
tags:
  - install
  - declare-only
  - manifest
